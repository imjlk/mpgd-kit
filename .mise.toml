[tools]
# ttsc 0.34's module (`go 1.27` in node_modules/ttsc/go.mod) and typia 15.2's
# native plugin need Go 1.27; this matches the go1.27.3 ttsc 0.34.2 bundles.
go = "1.27.3"
node = "24.22.0"
pnpm = "11.7.0"

[env]
# ttsc bundles its own Go toolchain, but source-plugin compilation must use the
# patched project toolchain so GOROOT and the compiler version stay aligned.
TTSC_GO_BINARY = { value = "{{ env.GOROOT }}/bin/go", tools = true }
