include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// Compile the optional Play Billing plugin without bundling it into the base app.
if (providers.gradleProperty('mpgdPlayBillingPluginTest').orNull == 'true') {
    include ':mpgd-capacitor-play-billing'
    // `mpgdPlayBillingPluginDir` points at a packed copy (tools/smoke/native-packed-store-plugins.mjs).
    def packedPlayBilling = providers.gradleProperty('mpgdPlayBillingPluginDir').orNull
    project(':mpgd-capacitor-play-billing').projectDir = packedPlayBilling != null
        ? new File(packedPlayBilling)
        : new File(settingsDir, '../../../native-plugins/capacitor-play-billing/android')
}
