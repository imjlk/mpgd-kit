"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "mpgd-game-services"
main = "src/index.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
MPGD_STORE = "memory"
# Local-only: accept client-submitted purchase/ad evidence without a provider
# check. Never set this for a deployment; the Worker refuses to start when it is
# combined with MPGD_STORE = "d1".
# MPGD_ALLOW_INSECURE_DEVELOPMENT_EVIDENCE = "true"
# The unverified leaderboard record route (/game-services/leaderboard/record and
# /rpc/leaderboard/recordScore) is not mounted on the public ingress by default;
# public requests receive 404 and score writes stay on the service binding RPC.
# Opt in only behind game-owned authenticated ingress.
# MPGD_ALLOW_PUBLIC_LEADERBOARD_RECORD = "true"
# Optional AdMob SSV intake: set MPGD_STORE = "d1", bind DB below, apply
# migration 0005_admob_ssv_callbacks.sql, then configure actual signed ad_unit
# IDs (not full SDK ca-app-pub-... load identifiers). Callback URLs are
# /admob/ssv/android and /admob/ssv/ios over HTTPS. Review the game-owned
# placement/catalog and authenticated claim boundary before enabling.
# MPGD_ADMOB_SSV_ANDROID_AD_UNIT = "<actual-android-ad-unit>"
# MPGD_ADMOB_SSV_IOS_AD_UNIT = "<actual-ios-ad-unit>"
# Optional explicit custom advertising registrations (JSON vars). Configure the
# private GAME_SERVICES_AD_REWARD_EVIDENCE_VERIFIER service below and authenticate
# provider proof there. Keep game-owned placement IDs under the same deployment key.
# MPGD_AD_REWARD_VERIFIERS = [{ providerId = "game-provider", schema = "game-provider.reward.v1", bindings = [{ target = "browser", deploymentTarget = "browser-stage" }] }]
# MPGD_DEPLOYMENT_TARGET_BINDINGS = { browser = "browser-stage" }

[observability]
enabled = true
head_sampling_rate = 1

# For production persistence, create a D1 database and uncomment this binding.
# Then set MPGD_STORE = "d1" and apply every SQL file in migrations/ in order.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "mpgd-game-services"
# database_id = "<replace-with-wrangler-d1-create-output>"

# Bind a private identity Worker to enable authenticated public snapshot reads.
# The service must implement authenticateVerifiedLeaderboardSnapshot({ authorization }).

# Verse8 rewarded-ad grants can use the built-in verifier credential:
#   pnpm exec wrangler secret put VERSE8_ADS_VERIFIER_AUTHORIZATION
# Store the complete Authorization header value issued for the Verse8
# consume-once /ads/verify endpoint. VERSE8_ADS_VERIFIER_BASE_URL is optional
# and defaults to https://ads-verifier.verse8.io. Alternatively, bind a private
# GAME_SERVICES_VERSE8_EVIDENCE_VERIFIER service below; that binding takes
# precedence over the built-in verifier.
#
# [[services]]
# binding = "VERIFIED_LEADERBOARD_AUTH"
# service = "game-identity"

# Optional ingress authentication for the public purchases, ad-rewards, and
# leaderboard grant routes. The service must implement
# authenticateGameServicesRequest({ authorization }) and return { playerId },
# or undefined / null when the token does not resolve. When bound, public grant
# requests without a resolvable Authorization header receive 401, a body
# playerId that differs from the authenticated player receives 403, and a
# binding error or malformed result receives 500. Without it, the public
# ingress stays unauthenticated and must sit behind game-owned auth and abuse
# controls.
#
# [[services]]
# binding = "GAME_SERVICES_INGRESS_AUTH"
# service = "game-identity"
# entrypoint = "GameServicesIngressAuth"

# Bind either one aggregate evidence verifier Worker or one verifier per
# production target. If any target-specific binding is configured, configure
# every target served by this deployment; missing targets fail closed and do
# not fall back to the aggregate binding.
#
# [[services]]
# binding = "GAME_SERVICES_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier"
#
# Optional registered advertising verifier. Implements verifyAdReward(input),
# including the server-selected providerId and the numeric timeoutMs budget.
# [[services]]
# binding = "GAME_SERVICES_AD_REWARD_EVIDENCE_VERIFIER"
# service = "game-ad-proof-verifier"
#
# [[services]]
# binding = "GAME_SERVICES_ANDROID_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-android"
#
# [[services]]
# binding = "GAME_SERVICES_IOS_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-ios"
#
# [[services]]
# binding = "GAME_SERVICES_AIT_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-ait"
#
# Microsoft Store developer-managed consumables require both bindings. The
# verifier queries Collections before the ledger grant, while the finalizer
# consumes the same collection item after the durable grant is committed.
# Never configure only one of this pair.
#
# [[services]]
# binding = "GAME_SERVICES_MICROSOFT_STORE_EVIDENCE_VERIFIER"
# service = "game-microsoft-store-authority"
# entrypoint = "MicrosoftStoreEvidenceVerifier"
#
# [[services]]
# binding = "GAME_SERVICES_MICROSOFT_STORE_PURCHASE_FINALIZER"
# service = "game-microsoft-store-authority"
# entrypoint = "MicrosoftStorePurchaseFinalizer"
#
# [[services]]
# binding = "GAME_SERVICES_VERSE8_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-verse8"
#
# Commerce v2 (C2): the Worker composes its evidence registry from the
# bindings above. The google-play entry declares finish = server, so an
# Android verifier must be paired with a Play finalizer or the Worker refuses
# to start. Either run the Play boundary in this Worker (the package name plus
# a private service that mints Android Publisher access tokens from the
# game-owned service account; bind the account-id resolver or opt into
# unbound players only when ingress auth already binds playerId) ...
#
# GAME_SERVICES_GOOGLE_PLAY_PACKAGE_NAME = "com.example.game"
# GAME_SERVICES_GOOGLE_PLAY_ALLOW_UNBOUND_PLAYER = "true"
#
# [[services]]
# binding = "GAME_SERVICES_GOOGLE_PLAY_PUBLISHER_AUTH"
# service = "game-play-publisher-auth"
#
# [[services]]
# binding = "GAME_SERVICES_GOOGLE_PLAY_ACCOUNT_BINDING"
# service = "game-identity"
# entrypoint = "GooglePlayAccountBinding"
#
# ... or bind a private finalizer that acknowledges or consumes the purchase,
#
# [[services]]
# binding = "GAME_SERVICES_ANDROID_PURCHASE_FINALIZER"
# service = "game-play-finalizer"
#
# ... or declare that the Android verifier binding acknowledges purchases
# itself (the store is then published with the client finish owner).
# GAME_SERVICES_ANDROID_VERIFIER_FINALIZES = "true"
#
# Server-push stores: look the client's devvit.order.v1 and
# verse8.agent8-event.v1 envelopes up against this Worker's ledger, which the
# fulfillment handler (Devvit) or the Agent8 service (Verse8) must write.
# Apply migration 0006_entitlement_revocations.sql for the revoke entries the
# ledger status read reports.
# MPGD_COMMERCE_LOOKUP_STORES = ["devvit", "verse8"]
#
# Optional: let the Devvit fulfillment handler verify its own order through
# this Worker (devvit.payment-order.v1) instead of writing the ledger
# directly. The service reads the order from the Devvit payments plugin.
#
# [[services]]
# binding = "GAME_SERVICES_DEVVIT_PAYMENT_ORDER_AUTHORITY"
# service = "game-devvit-payments-authority"
#
# Notifications v2 (docs/CLOUDFLARE_WORKER_DEPLOY.md#notifications-v2): set the
# game's topic catalog and deployment settings as JSON vars, apply migration
# 0007_notifications.sql, bind the session authenticator, and put the Firebase
# service-account key in a secret (wrangler secret put FCM_SERVICE_ACCOUNT).
# Never commit the key.
#
# MPGD_NOTIFICATIONS_CATALOG = { version = "...", defaultLocale = "ko", topics = [] }
# MPGD_NOTIFICATIONS_DEPLOYMENT = { advertisingRules = "kr", advertisingSender = { contact = "..." } }
#
# [[services]]
# binding = "GAME_SERVICES_NOTIFICATIONS_AUTH"
# service = "game-identity"
# entrypoint = "NotificationSessions"
#
# Apps in Toss functional messages (the ait target): the partner API client
# certificate, the provider settings (a var, under [vars]), and the identity
# service that answers a player's Toss user key (any entrypoint with
# resolveNotificationRecipient; the name below is an example).
#
# MPGD_AIT_NOTIFICATIONS = { recipientKey = "toss-user" }
#
# [[mtls_certificates]]
# binding = "AIT_PARTNER_MTLS"
# certificate_id = "..."
#
# [[services]]
# binding = "GAME_SERVICES_NOTIFICATIONS_IDENTITY"
# service = "game-identity"
# entrypoint = "NotificationRecipients"
#
# [[queues.producers]]
# binding = "NOTIFICATIONS_QUEUE"
# queue = "mpgd-notifications"
#
# [[queues.consumers]]
# queue = "mpgd-notifications"
# max_retries = 5
# dead_letter_queue = "mpgd-notifications-dead"
#
# [triggers]
# crons = ["*/5 * * * *"]
