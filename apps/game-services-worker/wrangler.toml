"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "mpgd-game-services"
main = "src/index.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
MPGD_STORE = "memory"
# Optional AdMob SSV intake: set MPGD_STORE = "d1", bind DB below, apply
# migration 0005_admob_ssv_callbacks.sql, then configure actual signed ad_unit
# IDs (not full SDK ca-app-pub-... load identifiers). Callback URLs are
# /admob/ssv/android and /admob/ssv/ios over HTTPS. Review the game-owned
# placement/catalog and authenticated claim boundary before enabling.
# MPGD_ADMOB_SSV_ANDROID_AD_UNIT = "<actual-android-ad-unit>"
# MPGD_ADMOB_SSV_IOS_AD_UNIT = "<actual-ios-ad-unit>"

[observability]
enabled = true
head_sampling_rate = 1

# For production persistence, create a D1 database and uncomment this binding.
# Then set MPGD_STORE = "d1" and apply every SQL file in migrations/ in order.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "mpgd-game-services"
# database_id = "<replace-with-wrangler-d1-create-output>"

# Bind a private identity Worker to enable authenticated public snapshot reads.
# The service must implement authenticateVerifiedLeaderboardSnapshot({ authorization }).

# Verse8 rewarded-ad grants can use the built-in verifier credential:
#   pnpm exec wrangler secret put VERSE8_ADS_VERIFIER_AUTHORIZATION
# Store the complete Authorization header value issued for the Verse8
# consume-once /ads/verify endpoint. VERSE8_ADS_VERIFIER_BASE_URL is optional
# and defaults to https://ads-verifier.verse8.io. Alternatively, bind a private
# GAME_SERVICES_VERSE8_EVIDENCE_VERIFIER service below; that binding takes
# precedence over the built-in verifier.
#
# [[services]]
# binding = "VERIFIED_LEADERBOARD_AUTH"
# service = "game-identity"

# Bind either one aggregate evidence verifier Worker or one verifier per
# production target. If any target-specific binding is configured, configure
# every target served by this deployment; missing targets fail closed and do
# not fall back to the aggregate binding.
#
# [[services]]
# binding = "GAME_SERVICES_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier"
#
# [[services]]
# binding = "GAME_SERVICES_ANDROID_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-android"
#
# [[services]]
# binding = "GAME_SERVICES_IOS_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-ios"
#
# [[services]]
# binding = "GAME_SERVICES_AIT_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-ait"
#
# Microsoft Store developer-managed consumables require both bindings. The
# verifier queries Collections before the ledger grant, while the finalizer
# consumes the same collection item after the durable grant is committed.
# Never configure only one of this pair.
#
# [[services]]
# binding = "GAME_SERVICES_MICROSOFT_STORE_EVIDENCE_VERIFIER"
# service = "game-microsoft-store-authority"
# entrypoint = "MicrosoftStoreEvidenceVerifier"
#
# [[services]]
# binding = "GAME_SERVICES_MICROSOFT_STORE_PURCHASE_FINALIZER"
# service = "game-microsoft-store-authority"
# entrypoint = "MicrosoftStorePurchaseFinalizer"
#
# [[services]]
# binding = "GAME_SERVICES_VERSE8_EVIDENCE_VERIFIER"
# service = "game-evidence-verifier-verse8"
