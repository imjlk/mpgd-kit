<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runtime controls fixture</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; background: #dce5ef; }
      #actions { box-sizing: border-box; max-width: 1000px; padding: 18px; font: 15px/1.5 Arial, sans-serif; color: #1f3550; }
      #actions button, #actions select { padding: 8px 12px; margin: 3px; }
      #action-state { display: block; margin-top: 8px; }
      canvas { display: block; max-width: 100vw; border-radius: 18px; box-shadow: 0 16px 60px #1e355b22; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <section id="actions" aria-label="Simulated service operations">
      <strong>Service operations · local simulation</strong>
      <div>
        <label>Outcome <select id="action-mode"><option>granted</option><option>pending</option><option>rejected</option><option>exception</option></select></label>
        <button id="purchase">Purchase</button><button id="rewarded-ad">Rewarded ad</button>
        <button id="settle">Complete server response</button>
        <button id="close-action-ui">Close UI / open new screen</button>
        <button id="next-action">New action key</button>
      </div>
      <output id="action-state" aria-live="polite"></output>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
