packages:
  - 'apps/*'
  - 'packages/*'
  - 'adapters/*'
  - 'native-plugins/*'
  - 'backend/*'
  - 'examples/*'
allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@ttsc/darwin-arm64@0.30.4'
  - '@ttsc/darwin-x64@0.30.4'
  - '@ttsc/graph@0.30.4'
  - '@ttsc/lint@0.30.4'
  - '@ttsc/linux-arm64@0.30.4'
  - '@ttsc/linux-arm@0.30.4'
  - '@ttsc/linux-x64@0.30.4'
  - '@ttsc/paths@0.30.4'
  - '@ttsc/strip@0.30.4'
  - '@ttsc/unplugin@0.30.4'
  - '@ttsc/win32-arm64@0.30.4'
  - '@ttsc/win32-x64@0.30.4'
  - '@typia/interface@13.0.2'
  - '@typia/mcp@13.0.2'
  - '@typia/utils@13.0.2'
  - ttsc@0.30.4
  - typia@13.0.2
  - '@orpc/client@2.0.0-beta.14'
  - '@orpc/contract@2.0.0-beta.14'
  - '@orpc/interop@2.0.0-beta.14'
  - '@orpc/server@2.0.0-beta.14'
  - '@orpc/shared@2.0.0-beta.14'
  - '@devvit/build-pack@0.14.1'
  - '@devvit/builders@0.14.1'
  - '@devvit/cache@0.14.1'
  - '@devvit/cli@0.14.1'
  - '@devvit/client@0.14.1'
  - '@devvit/external-endpoints@0.14.1'
  - '@devvit/linkers@0.14.1'
  - '@devvit/media@0.14.1'
  - '@devvit/notifications@0.14.1'
  - '@devvit/payments@0.14.1'
  - '@devvit/protos@0.14.1'
  - '@devvit/public-api@0.14.1'
  - '@devvit/realtime@0.14.1'
  - '@devvit/reddit@0.14.1'
  - '@devvit/redis@0.14.1'
  - '@devvit/scheduler@0.14.1'
  - '@devvit/server@0.14.1'
  - '@devvit/settings@0.14.1'
  - '@devvit/shared-types@0.14.1'
  - '@devvit/shared@0.14.1'
  - '@devvit/start@0.14.1'
  - '@devvit/web-view-scripts@0.14.1'
  - '@devvit/web@0.14.1'
  - devvit@0.14.1
  - '@apps-in-toss/cli@3.5.0'
  - '@apps-in-toss/web-framework@3.5.0'
overrides:
  '@xmldom/xmldom': '0.9.12'
  # Security patches for transitive advisories reported by `pnpm audit --prod`.
  # Each pin stays inside the range the dependents declare, so no dependent is
  # forced onto an incompatible major or minor.
  'nanoid@3': '3.3.19' # postcss declares ^3.3.12
  'postcss@8': '8.5.28' # vite 8 declares ^8.5.16, vite 7 declares ^8.5.6
  'brace-expansion@1': '1.1.21' # minimatch 3 declares ^1.1.7
  'browserslist@4': '4.29.3' # @babel/helper-compilation-targets ^4.24.0, core-js-compat ^4.28.1
  'baseline-browser-mapping@2': '2.11.27' # browserslist declares ^2.10.38
  'qs@6': '6.16.0' # googleapis-common ^6.7.0, express ^6.14.0, body-parser ^6.15.2
  # @devvit/protos pins protobufjs to exactly 7.6.3, so only the Apps in Toss
  # path (declared ^7.5.4) is patched here.
  '@apps-in-toss/ait-format-proto>protobufjs': '7.6.6'
