name: release-microsoft-store

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        default: production
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: release-microsoft-store-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:public
      - run: pnpm check
      - run: pnpm validate:catalog
      - run: pnpm validate:ads
      - run: pnpm validate:target-config
      - run: pnpm validate:effective-config
      - run: pnpm validate:targets
      - run: pnpm smoke:target-config
      - run: pnpm smoke:effective-config
      - run: pnpm smoke:adapter-effective-config
      - run: pnpm smoke:game-services
      - run: pnpm build:target microsoft-store "${PROFILE}"
        env:
          PROFILE: ${{ inputs.profile }}
      - run: pnpm smoke:target microsoft-store

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microsoft-store-${{ inputs.profile }}
          path: |
            examples/phaser-starter/artifacts/**
