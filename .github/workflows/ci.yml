name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release_pr_metadata_only: ${{ steps.release-pr-meta.outputs.enabled }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine metadata-only validation
        id: release-pr-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if ! base_sha="$(git merge-base "origin/${PR_BASE_REF}" HEAD)"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Could not resolve merge base against origin/${PR_BASE_REF}; running full validation."
              exit 0
            fi
          else
            # origin/main is already fetched by checkout (fetch-depth: 0);
            # fetching again would need credentials because persist-credentials
            # is disabled and would fail on private repositories.
            if ! base_sha="$(git merge-base origin/main HEAD)"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Could not resolve merge base against origin/main; running full validation."
              exit 0
            fi
          fi

          mapfile -t changed_files < <(git diff --no-renames --name-only "${base_sha}...HEAD")
          metadata_only=true
          if ((${#changed_files[@]} == 0)); then
            metadata_only=false
          fi

          for path in "${changed_files[@]}"; do
            case "${path}" in
              .sampo/changesets/*.md|CHANGELOG.md|*/CHANGELOG.md)
                ;;
              package.json|*/package.json)
                package_diff="$(git diff --no-renames --unified=0 "${base_sha}...HEAD" -- "${path}")" || metadata_only=false
                package_diff="$(printf '%s\n' "${package_diff}" | grep -E '^[+-]' | grep -Ev '^(---|\+\+\+)' || true)"
                if [[ -z "${package_diff}" ]]; then
                  metadata_only=false
                else
                  non_version_lines="$(printf '%s\n' "${package_diff}" | grep -Ev '^[+-]  "version"[[:space:]]*:[[:space:]]*"[^"]*"[[:space:]]*,?[[:space:]]*$' || true)"
                  if [[ -n "${non_version_lines}" ]]; then
                    metadata_only=false
                  fi
                fi
                ;;
              *)
                metadata_only=false
                ;;
            esac
          done

          echo "enabled=${metadata_only}" >> "$GITHUB_OUTPUT"
          echo "Metadata-only validation: ${metadata_only}"
          printf 'Changed files:\n%s\n' "${changed_files[*]:-<none>}"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release PR package metadata
        if: ${{ steps.release-pr-meta.outputs.enabled == 'true' }}
        run: pnpm validate:public && pnpm pack:packages

      - run: pnpm check
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm validate:catalog
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm validate:ads
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm validate:target-config
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm validate:effective-config
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm validate:targets
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm build:packages
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - name: Cache example browsers
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-runtime-playwright-${{ hashFiles('examples/runtime-controls/package.json', 'examples/asset-packs/package.json') }}
          restore-keys: ${{ runner.os }}-runtime-playwright-
      - name: Install runtime fixture browser
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        timeout-minutes: 10
        run: pnpm --dir examples/runtime-controls exec playwright install --with-deps chromium
      - name: Verify Phaser runtime controls in Chromium
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        timeout-minutes: 5
        run: pnpm --dir examples/runtime-controls build && pnpm --dir examples/runtime-controls test:browser
      - name: Install asset pack example browser
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        timeout-minutes: 10
        run: pnpm --dir examples/asset-packs exec playwright install --with-deps chromium
      - name: Verify asset pack delivery and lifetime in Chromium
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        timeout-minutes: 5
        run: pnpm --dir examples/asset-packs test:browser
      - name: Verify packaged asset consumer in Chromium
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        timeout-minutes: 10
        run: pnpm --dir examples/asset-packs test:packed-consumer
      - name: Upload asset pack browser evidence
        if: ${{ always() && steps.release-pr-meta.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: asset-pack-browser-evidence
          path: examples/asset-packs/artifacts/browser/
          if-no-files-found: ignore
      - run: pnpm smoke:apps-in-toss-production-evidence:prepared
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: tar -czf "$RUNNER_TEMP/package-dist.tgz" packages/*/dist adapters/*/dist native-plugins/*/dist
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - uses: actions/upload-artifact@v6
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}/package-dist.tgz
      - run: pnpm graph:preflight
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm pack:packages:prepared
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm build:web
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target web-preview
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm build:microsoft-store
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
          VITE_MPGD_GAME_SERVICES_URL: https://services.example.com
      - run: pnpm smoke:target microsoft-store
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm build:verse8
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
          VITE_MPGD_GAME_SERVICES_URL: https://services.example.com
      - run: pnpm smoke:target verse8
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
      - run: pnpm test:prepared
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}

      - uses: actions/upload-artifact@v6
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' }}
        with:
          name: web-preview-microsoft-store-and-verse8-ci
          path: |
            examples/phaser-starter/artifacts/**

  build-android:
    if: ${{ needs.validate.outputs.release_pr_metadata_only != 'true' }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        # Google removed the legacy `tools` package from the SDK repository;
        # the action's `tools platform-tools` default now fails. The explicit
        # sdkmanager steps install what each build needs.
        with:
          packages: ''

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:target android staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - name: Test Android native storage conformance
        working-directory: apps/mobile-capacitor/android
        run: ./gradlew :mpgd-capacitor-game-services:testDebugUnitTest
      - run: pnpm smoke:target android

      - uses: actions/upload-artifact@v6
        with:
          name: android-ci
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**

  build-ios:
    if: ${{ needs.validate.outputs.release_pr_metadata_only != 'true' }}
    runs-on: macos-26
    needs: validate
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:target ios staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - name: Test iOS native storage conformance
        run: |
          xcrun swiftc \
            native-plugins/capacitor-game-services/ios/Sources/CapacitorGameServices/LocalJsonStorage.swift \
            native-plugins/capacitor-game-services/ios/Tests/LocalJsonStorageConformance/main.swift \
            -o "$RUNNER_TEMP/native-storage-conformance"
          "$RUNNER_TEMP/native-storage-conformance"
      - run: pnpm smoke:target ios

      - uses: actions/upload-artifact@v6
        with:
          name: ios-ci
          path: |
            examples/phaser-starter/artifacts/**

  build-ait:
    if: ${{ needs.validate.outputs.release_pr_metadata_only != 'true' }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:target ait staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target ait

      - uses: actions/upload-artifact@v6
        with:
          name: ait-ci
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**

  build-devvit:
    if: ${{ needs.validate.outputs.release_pr_metadata_only != 'true' }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:devvit
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target reddit

      - uses: actions/upload-artifact@v6
        with:
          name: devvit-ci
          path: |
            examples/phaser-starter/artifacts/**
            apps/target-devvit/dist/**
