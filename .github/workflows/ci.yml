name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release_pr_metadata_only: ${{ steps.release-pr-meta.outputs.enabled }}
      run_prepared: ${{ steps.release-pr-meta.outputs.run_prepared }}
      run_native: ${{ steps.release-pr-meta.outputs.run_native }}
      workspace_test_dirs: ${{ steps.release-pr-meta.outputs.workspace_test_dirs }}
      docs_only: ${{ steps.release-pr-meta.outputs.docs_only }}
      docs_validation: ${{ steps.release-pr-meta.outputs.docs_validation }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine metadata-only validation
        id: release-pr-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: |
          set -euo pipefail

          command -v node >/dev/null 2>&1 || { echo "::error::node is required before setup-node to detect workspace test scripts"; exit 1; }
          package_has_test() {
            local dir="$1"
            [[ "${dir}" != "packages/phaser-assets" && "${dir}" != "packages/tutorial" && -f "${dir}/package.json" ]] || return 1
            node -e 'let j;try{j=JSON.parse(require("fs").readFileSync(process.argv[1]+"/package.json","utf8"))}catch{process.exit(2)}process.exit(j.scripts&&j.scripts.test?0:1)' "${dir}"
          }
          register_workspace_test() {
            local package_dir="$1"
            local safe_path="$2"
            local test_status=0
            package_has_test "${package_dir}" || test_status=$?
            if (( test_status == 0 )); then
              workspace_test_dirs["${package_dir}"]=1
            elif (( test_status == 2 )); then
              local safe_dir="${package_dir//%/%25}"
              safe_dir="${safe_dir//$'\r'/}"
              safe_dir="${safe_dir//$'\n'/}"
              echo "::warning file=${safe_path}::Workspace package ${safe_dir} has malformed package.json; selective tests are skipped for it."
            elif [[ "${package_dir}" != "packages/phaser-assets" && "${package_dir}" != "packages/tutorial" && -f "${package_dir}/package.json" ]]; then
              local safe_dir="${package_dir//%/%25}"
              safe_dir="${safe_dir//$'\r'/}"
              safe_dir="${safe_dir//$'\n'/}"
              echo "::warning file=${safe_path}::Workspace package ${safe_dir} has no test script; selective tests are skipped for it unless another change in this PR enables the prepared smoke suite."
            fi
          }
          run_prepared=true
          run_native=false
          declare -A workspace_test_dirs=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # PRs and main pushes share the focused path classifier below.
            # Contract changes still run the prepared/native suite; ordinary
            # package changes should not pay its 40-minute cost twice.
            run_prepared=false
            if ! base_sha="$(git merge-base "origin/${PR_BASE_REF}" HEAD)"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "run_prepared=true" >> "$GITHUB_OUTPUT"
              echo "run_native=false" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "docs_validation=true" >> "$GITHUB_OUTPUT"
              echo "Could not resolve merge base against origin/${PR_BASE_REF}; running full validation."
              exit 0
            fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            # A main checkout points origin/main at HEAD. Compare the full
            # pushed range instead; fail open to full CI for missing or
            # rewritten history rather than misclassifying changed source.
            if [[ ! "${PUSH_BEFORE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || ! git merge-base --is-ancestor "${PUSH_BEFORE_SHA}" HEAD; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "run_prepared=true" >> "$GITHUB_OUTPUT"
              echo "run_native=false" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "docs_validation=true" >> "$GITHUB_OUTPUT"
              echo "Could not resolve the previous main commit; running full validation."
              exit 0
            fi
            base_sha="${PUSH_BEFORE_SHA}"
            # Reuse focused PR CI only if it attested this exact base/head
            # merged tree. A head-only CI run may have tested an older base.
            read -r -a push_commit_parents <<< "$(git rev-list --parents -n 1 HEAD)"
            if [[ ${#push_commit_parents[@]} -eq 3 && "${push_commit_parents[1]}" == "${base_sha}" ]]; then
              if pr_data="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"; then
                pr_number="$(jq -r --arg merge_sha "${GITHUB_SHA}" '[.[] | select(.merged_at != null and .merge_commit_sha == $merge_sha)] | .[0].number // empty' <<< "${pr_data}")"
                pr_head_sha="$(jq -r --arg merge_sha "${GITHUB_SHA}" '[.[] | select(.merged_at != null and .merge_commit_sha == $merge_sha)] | .[0].head.sha // empty' <<< "${pr_data}")"
                if [[ "${pr_head_sha}" == "${push_commit_parents[2]}" ]]; then
                  merge_tree_sha="$(git rev-parse 'HEAD^{tree}')"
                  expected_artifact="ci-tested-pr${pr_number}-${base_sha}-${pr_head_sha}-${merge_tree_sha}"
                  if ci_runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${pr_head_sha}" --event pull_request --limit 30 --json databaseId,event,status,conclusion,headSha)"; then
                    while IFS= read -r run_id; do
                      if artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"; then
                        if jq -e --arg name "${expected_artifact}" '[.artifacts[] | select(.name == $name and .expired == false)] | length > 0' <<< "${artifacts}" >/dev/null; then
                          run_prepared=false
                          break
                        fi
                      fi
                    done < <(jq -r --arg sha "${pr_head_sha}" '.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success") | .databaseId' <<< "${ci_runs}")
                  fi
                fi
              fi
            fi
            if [[ "${run_prepared}" == "true" ]]; then
              echo "Main commit has no successful PR CI attestation for its exact base/head/tree; running full validation."
            fi
          else
            # origin/main is already fetched by checkout (fetch-depth: 0);
            # fetching again would need credentials because persist-credentials
            # is disabled and would fail on private repositories.
            if ! base_sha="$(git merge-base origin/main HEAD)"; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "run_prepared=true" >> "$GITHUB_OUTPUT"
              echo "run_native=false" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "docs_validation=true" >> "$GITHUB_OUTPUT"
              echo "Could not resolve merge base against origin/main; running full validation."
              exit 0
            fi
          fi

          mapfile -t changed_files < <(git diff --no-renames --name-only "${base_sha}...HEAD")
          metadata_only=true
          docs_only=true
          docs_validation=false
          if ((${#changed_files[@]} == 0)); then
            metadata_only=false
            run_prepared=true
            docs_only=false
            docs_validation=true
          fi

          if [[ "${EVENT_NAME}" == "push" ]] && ((${#changed_files[@]} > 0)); then
            for path in "${changed_files[@]}"; do
              case "${path}" in
                .github/workflows/ci.yml)
                  # The classifier itself is exercised below. Only skip the
                  # long suite when the surrounding workflow (including every
                  # test and native job) is byte-for-byte unchanged.
                  if ! ci_before="$(git show "${base_sha}:.github/workflows/ci.yml")"; then
                    run_prepared=true
                    break
                  fi
                  if ! ci_after="$(git show HEAD:.github/workflows/ci.yml)"; then
                    run_prepared=true
                    break
                  fi
                  classifier_start='      - name: Determine metadata-only validation'
                  classifier_end='      - uses: pnpm/action-setup@v6'
                  if [[ "${ci_before}" != *"${classifier_start}"* || "${ci_after}" != *"${classifier_start}"* || "${ci_before}" != *"${classifier_end}"* || "${ci_after}" != *"${classifier_end}"* ]]; then
                    echo "::warning file=.github/workflows/ci.yml::Classifier step markers changed; running full validation."
                    run_prepared=true
                    break
                  fi
                  if [[ "$(awk -v marker="${classifier_start}" '{ print; if ($0 == marker) exit }' <<< "${ci_before}")" != "$(awk -v marker="${classifier_start}" '{ print; if ($0 == marker) exit }' <<< "${ci_after}")" ]] ||
                    [[ "$(awk -v marker="${classifier_end}" '$0 == marker { copy=1 } copy { print }' <<< "${ci_before}")" != "$(awk -v marker="${classifier_end}" '$0 == marker { copy=1 } copy { print }' <<< "${ci_after}")" ]]; then
                    echo "CI workflow changed outside the classifier; running full validation."
                    run_prepared=true
                    break
                  fi
                  ;;
                .github/workflows/release.yml) ;;
                .github/workflows/*)
                  # Other workflow files may alter native/test jobs or their
                  # triggers; preserve full validation for those edits.
                  run_prepared=true
                  break
                  ;;
                *) continue ;;
              esac
            done
          fi

          for path in "${changed_files[@]}"; do
            case "${path}" in
              docs/*|README.md|rspress.config.ts|lint.config.js|tsconfig.base.json|tsconfig.evidence.json|tsconfig.docs-examples.json|tools/docs/*|packages/platform/*|package.json|pnpm-lock.yaml|.github/workflows/ci.yml)
                docs_validation=true
                ;;
            esac
            case "${path}" in
              docs/*|README.md) ;;
              *) docs_only=false ;;
            esac
            safe_path="${path//%/%25}"
            safe_path="${safe_path//$'\r'/}"
            safe_path="${safe_path//$'\n'/}"
            safe_path="${safe_path//:/%3A}"
            safe_path="${safe_path//,/%2C}"
            package_json_has_content=false
            case "${path}" in
              .sampo/changesets/*.md|CHANGELOG.md|*/CHANGELOG.md)
                ;;
              package.json|*/package.json)
                if ! package_diff="$(git diff --no-renames --unified=0 "${base_sha}...HEAD" -- "${path}")"; then
                  metadata_only=false
                  package_json_has_content=true
                else
                  package_diff="$(printf '%s\n' "${package_diff}" | grep -E '^[+-]' | grep -Ev '^(---|\+\+\+)' || true)"
                  if [[ -z "${package_diff}" ]]; then
                    metadata_only=false
                    package_json_has_content=true
                  fi
                  non_version_lines="$(printf '%s\n' "${package_diff}" | grep -Ev '^[+-]  "version"[[:space:]]*:[[:space:]]*"[^"]*"[[:space:]]*,?[[:space:]]*$' || true)"
                  if [[ -n "${non_version_lines}" ]]; then
                    metadata_only=false
                    package_json_has_content=true
                  fi
                fi
                ;;
              *)
                metadata_only=false
                ;;
            esac

            if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "push" ]]; then
              case "${path}" in
                *.md|.github/*|examples/asset-packs/asset-source/*|examples/asset-packs/delivery-configs/*)
                  ;;
                release.manifest.schema.json)
                  run_prepared=true
                  ;;
                package.json)
                  if [[ "${package_json_has_content}" == "true" ]]; then
                    # Private docs command changes do not affect package or
                    # target runtime contracts. Keep the prepared suite for
                    # every other root manifest edit.
                    if ! node -e '
                      const { execFileSync } = require("node:child_process");
                      const { readFileSync } = require("node:fs");
                      const before = JSON.parse(execFileSync("git", ["show", process.argv[1] + ":package.json"], { encoding: "utf8" }));
                      const after = JSON.parse(readFileSync("package.json", "utf8"));
                      for (const manifest of [before, after]) {
                        for (const name of Object.keys(manifest.scripts ?? {})) {
                          if (name.startsWith("docs:")) delete manifest.scripts[name];
                        }
                      }
                      process.exit(JSON.stringify(before) === JSON.stringify(after) ? 0 : 1);
                    ' "${base_sha}"; then
                      run_prepared=true
                    fi
                  fi
                  ;;
                packages/cli/package.json|packages/create-game/package.json|packages/game-services/package.json|packages/release-manifest/package.json|packages/target-*/package.json|apps/game-services-worker/package.json|apps/target-*/package.json|apps/mobile-capacitor/package.json|packages/cli/templates/*package.json|adapters/*/package.json|native-plugins/*/package.json|backend/*/package.json)
                  if [[ "${package_json_has_content}" == "true" ]]; then
                    run_prepared=true
                  fi
                  ;;
                tsconfig.evidence.json|tsconfig.docs-examples.json)
                  # Narrow documentation Programs cannot change published
                  # packages or the prepared runtime suite.
                  ;;
                tools/*.ts|tools/*.mjs|tools/ci/*|tools/package/*|tools/graph/*|tools/smoke/*|tools/target/*|tools/icons/*|tools/fixtures/*|packages/bridge/*|packages/platform/*|packages/cli/*|packages/create-game/*|packages/game-services/*|packages/release-manifest/*|packages/target-*/*|apps/game-services-worker/*|apps/target-*/*|apps/mobile-capacitor/*|adapters/*|native-plugins/*|backend/*)
                  run_prepared=true
                  ;;
                examples/phaser-starter/*)
                  run_prepared=true
                  ;;
                packages/phaser-assets/src/*|examples/asset-packs/src/*)
                  # Covered by focused package/archive tests and both source
                  # and installed-tarball Chromium acceptance below.
                  ;;
                packages/*/package.json|apps/*/package.json)
                  package_root="${path%%/*}"
                  package_name="${path#*/}"
                  package_name="${package_name%%/*}"
                  register_workspace_test "${package_root}/${package_name}" "${safe_path}"
                  ;;
                packages/*|apps/*)
                  package_root="${path%%/*}"
                  package_name="${path#*/}"
                  package_name="${package_name%%/*}"
                  package_dir="${package_root}/${package_name}"
                  register_workspace_test "${package_dir}" "${safe_path}"
                  ;;
                */package.json|pnpm-lock.yaml|pnpm-workspace.yaml|mise.toml|tsconfig*.json|vitest.config.*|vite.config.*)
                  case "${path}" in
                    pnpm-lock.yaml|examples/*|pnpm-workspace.yaml|mise.toml|tsconfig*.json|vitest.config.*|vite.config.*)
                      case "${path}" in
                        pnpm-lock.yaml|pnpm-workspace.yaml|mise.toml|tsconfig*.json|vitest.config.*|vite.config.*)
                          run_prepared=true
                          ;;
                      esac
                      echo "::warning file=${safe_path}::Workspace configuration changed; running affected workspace tests."
                      for package_dir in packages/* apps/* adapters/* native-plugins/* backend/* examples/*; do
                        register_workspace_test "${package_dir}" "${safe_path}"
                      done
                      ;;
                    *)
                      echo "::warning file=${safe_path}::Unrecognized package.json location skips the prepared smoke suite; add it to the contract list if it affects CLI/target/release acceptance."
                      ;;
                  esac
                  ;;
                *)
                  case "${path}" in
                    packages/*|apps/*|tools/*|adapters/*|native-plugins/*|backend/*)
                      echo "::warning file=${safe_path}::Unrecognized path skips the prepared smoke suite; add it to the contract list if it affects CLI/target/release acceptance."
                      ;;
                  esac
                  # Unknown paths stay focused. New CLI/target/release
                  # contract locations must be added above.
                  ;;
              esac
            fi
          done

          if [[ "${EVENT_NAME}" == "push" ]]; then
            # Every successful main push publishes the current site. If an
            # earlier run skips a stale artifact, this run replaces it even
            # when its own changed paths do not touch documentation.
            docs_validation=true
          elif [[ "${metadata_only}" == "true" ]]; then
            # A metadata-only release PR does not need docs validation.
            docs_validation=false
          fi
          if [[ "${docs_only}" == "true" ]]; then
            # Only Markdown or private example sources changed. The docs job
            # supplies Evidence, example, site-build, and link coverage. This
            # also applies to unattested docs-only pushes on main.
            run_prepared=false
          fi
          if [[ "${EVENT_NAME}" == "pull_request" && "${metadata_only}" == "false" ]] &&
            [[ "$(node tools/ci/native-scope.mjs "${changed_files[@]}")" == true ]]; then
            # Only native-owned paths (and their Sampo changeset) qualify.
            # Keep the adapter's unit tests plus the Android/iOS build jobs;
            # shared contracts, lockfiles, and unknown paths remain full CI.
            run_prepared=false
            run_native=true
            register_workspace_test adapters/capacitor adapters/capacitor
          fi
          echo "enabled=${metadata_only}" >> "$GITHUB_OUTPUT"
          echo "run_prepared=${run_prepared}" >> "$GITHUB_OUTPUT"
          echo "run_native=${run_native}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs_validation=${docs_validation}" >> "$GITHUB_OUTPUT"
          if (( ${#workspace_test_dirs[@]} > 0 )); then
            {
              echo 'workspace_test_dirs<<EOF'
              printf '%s\n' "${!workspace_test_dirs[@]}" | sort
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi
          echo "Metadata-only validation: ${metadata_only}"
          echo "Prepared smoke suite: ${run_prepared}"
          echo "Native-only scope: ${run_native}"
          echo "Documentation-only validation: ${docs_only}"
          echo "Documentation checks: ${docs_validation}"
          printf 'Changed files:\n%s\n' "${changed_files[*]:-<none>}"

      - uses: pnpm/action-setup@v6
        if: ${{ steps.release-pr-meta.outputs.docs_only != 'true' }}
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        if: ${{ steps.release-pr-meta.outputs.docs_only != 'true' }}
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release-pr-meta.outputs.docs_only != 'true' }}

      - name: Cache compiled ttsc plugins
        if: ${{ steps.release-pr-meta.outputs.docs_only != 'true' }}
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-

      - name: Validate release PR package metadata
        if: ${{ steps.release-pr-meta.outputs.enabled == 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
        run: pnpm validate:public && pnpm pack:packages

      - run: pnpm check
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm validate:catalog
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm validate:ads
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm validate:target-config
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm validate:effective-config
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm validate:targets
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - run: pnpm build:packages
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      # Native and test jobs consume this immediately after package build.
      - run: tar -czf "$RUNNER_TEMP/package-dist.tgz" packages/*/dist adapters/*/dist native-plugins/*/dist
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
      - uses: actions/upload-artifact@v6
        if: ${{ steps.release-pr-meta.outputs.enabled != 'true' && steps.release-pr-meta.outputs.docs_only != 'true' }}
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}/package-dist.tgz
          retention-days: 1

  docs-validation:
    if: ${{ needs.prepare.outputs.docs_validation == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - run: pnpm docs:evidence
      - run: pnpm docs:examples:check
      - run: pnpm docs:examples:test
      - run: pnpm docs:site:build
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: doc_build

  test-focused:
    if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'false' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:build
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - name: Run changed workspace package tests
        if: ${{ needs.prepare.outputs.workspace_test_dirs != '' }}
        env:
          WORKSPACE_TEST_DIRS: ${{ needs.prepare.outputs.workspace_test_dirs }}
        run: |
          failed=0
          while IFS= read -r package_dir; do
            [[ -z "${package_dir}" ]] && continue
            echo "Testing changed workspace package: ${package_dir}"
            pnpm --dir "${package_dir}" run test || failed=1
          done <<< "${WORKSPACE_TEST_DIRS}"
          exit "${failed}"
      - name: Run focused package tests
        if: ${{ needs.prepare.outputs.run_native != 'true' }}
        run: |
          pnpm --filter @mpgd/phaser-assets test
          pnpm --filter @mpgd/tutorial test
          pnpm smoke:phaser-assets-archive-decode
          pnpm smoke:tutorial:dist
      - name: Verify native adapter contracts
        if: ${{ needs.prepare.outputs.run_native == 'true' }}
        run: |
          pnpm pack:packages:prepared
          pnpm smoke:native-packed-consumer
          pnpm smoke:adapter-effective-config
          pnpm smoke:platform-capability-conformance
          pnpm smoke:storage-adapter-conformance
          pnpm smoke:native-release-identity

  test-browser:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_native != 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:build
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - name: Cache example browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-runtime-playwright-${{ hashFiles('examples/runtime-controls/package.json', 'examples/asset-packs/package.json') }}
          restore-keys: ${{ runner.os }}-runtime-playwright-
      - name: Install runtime fixture browser
        timeout-minutes: 10
        run: pnpm --dir examples/runtime-controls exec playwright install --with-deps chromium
      - name: Verify Phaser runtime controls in Chromium
        timeout-minutes: 5
        run: pnpm --dir examples/runtime-controls build && pnpm --dir examples/runtime-controls test:browser
      - name: Install asset pack example browser
        timeout-minutes: 10
        run: pnpm --dir examples/asset-packs exec playwright install --with-deps chromium
      - name: Verify asset pack delivery and lifetime in Chromium
        timeout-minutes: 5
        run: pnpm --dir examples/asset-packs test:browser
      - name: Verify packaged asset consumer in Chromium
        timeout-minutes: 10
        run: pnpm --dir examples/asset-packs test:packed-consumer
      - name: Upload asset pack browser evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: asset-pack-browser-evidence
          path: examples/asset-packs/artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7

  compile-tools:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:build
      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm ci:emit-tools:prepared
      - run: tar -czf "$RUNNER_TEMP/compiled-tools.tgz" node_modules/.cache/mpgd-ci-tools
      - uses: actions/upload-artifact@v6
        with:
          name: compiled-tools-ci
          path: ${{ runner.temp }}/compiled-tools.tgz
          retention-days: 1

  test-prepared:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'true' }}
    needs: [prepare, compile-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [contracts, cli, services]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:build
      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - uses: actions/download-artifact@v7
        with:
          name: compiled-tools-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/compiled-tools.tgz"
      - run: pnpm run test:prepared:${{ matrix.group }}
        env:
          MPGD_CI_EMIT_ROOT: ${{ github.workspace }}/node_modules/.cache/mpgd-ci-tools

  build-web-targets:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:build
      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm smoke:apps-in-toss-production-evidence:prepared
      - run: pnpm graph:preflight
      - run: pnpm pack:packages:prepared
      - run: pnpm smoke:native-packed-consumer
      - run: pnpm build:web
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target web-preview
      - run: pnpm build:microsoft-store
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
          VITE_MPGD_GAME_SERVICES_URL: https://services.example.com
      - run: pnpm smoke:target microsoft-store
      - run: pnpm build:verse8
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
          VITE_MPGD_GAME_SERVICES_URL: https://services.example.com
      - run: pnpm smoke:target verse8
      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: web-preview-microsoft-store-and-verse8-ci
          path: examples/phaser-starter/artifacts/**
          retention-days: 7

  build-android:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && (needs.prepare.outputs.run_prepared == 'true' || needs.prepare.outputs.run_native == 'true') }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: android-actions/setup-android@v4
        # Google removed the legacy `tools` package from the SDK repository;
        # the action's `tools platform-tools` default now fails. The explicit
        # sdkmanager steps install what each build needs.
        with:
          packages: ''

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:target android staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - name: Prepare reference Android shell for plugin unit tests
        run: |
          mkdir -p apps/mobile-capacitor/www
          cp examples/phaser-starter/index.html apps/mobile-capacitor/www/index.html
          pnpm --dir apps/mobile-capacitor sync:android
      - name: Test Android native storage conformance
        working-directory: apps/mobile-capacitor/android
        run: ./gradlew :mpgd-capacitor-game-services:testDebugUnitTest
      - run: pnpm smoke:target android

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: android-ci
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**
          retention-days: 7

  build-ios:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && (needs.prepare.outputs.run_prepared == 'true' || needs.prepare.outputs.run_native == 'true') }}
    runs-on: macos-26
    needs: prepare
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm test:native-ios-signing
      - run: pnpm build:target ios staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - name: Test iOS native storage conformance
        run: |
          xcrun swiftc \
            native-plugins/capacitor-game-services/ios/Sources/CapacitorGameServices/LocalJsonStorage.swift \
            native-plugins/capacitor-game-services/ios/Tests/LocalJsonStorageConformance/main.swift \
            -o "$RUNNER_TEMP/native-storage-conformance"
          "$RUNNER_TEMP/native-storage-conformance"
          xcrun swiftc \
            native-plugins/capacitor-game-services/ios/Sources/CapacitorGameServices/SecureCredentialStorage.swift \
            native-plugins/capacitor-game-services/ios/Tests/SecureCredentialStorageConformance/main.swift \
            -o "$RUNNER_TEMP/native-credential-conformance"
          "$RUNNER_TEMP/native-credential-conformance"
      - run: pnpm smoke:target ios

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: ios-ci
          path: |
            examples/phaser-starter/artifacts/**
          retention-days: 7

  build-ait:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'true' }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:target ait staging
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target ait

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: ait-ci
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**
          retention-days: 7

  build-devvit:
    if: ${{ needs.prepare.outputs.release_pr_metadata_only != 'true' && needs.prepare.outputs.docs_only != 'true' && needs.prepare.outputs.run_prepared == 'true' }}
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-
      - uses: actions/download-artifact@v7
        with:
          name: package-dist-ci
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/package-dist.tgz"
      - run: pnpm build:devvit
        env:
          MPGD_SKIP_BUILD_TARGET_PREFLIGHT: '1'
      - run: pnpm smoke:target reddit

      - uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: devvit-ci
          path: |
            examples/phaser-starter/artifacts/**
            apps/target-devvit/dist/**
          retention-days: 7

  ci-required:
    # Keep one stable required check. An unexpectedly skipped dependency must
    # fail the workflow rather than leave a green-looking partial CI run.
    if: ${{ always() }}
    needs: [prepare, docs-validation, test-focused, test-browser, compile-tools, test-prepared, build-web-targets, build-android, build-ios, build-ait, build-devvit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      METADATA_ONLY: ${{ needs.prepare.outputs.release_pr_metadata_only }}
      RUN_PREPARED: ${{ needs.prepare.outputs.run_prepared }}
      RUN_NATIVE: ${{ needs.prepare.outputs.run_native }}
      DOCS_ONLY: ${{ needs.prepare.outputs.docs_only }}
      DOCS_VALIDATION: ${{ needs.prepare.outputs.docs_validation }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      DOCS_RESULT: ${{ needs.docs-validation.result }}
      FOCUSED_RESULT: ${{ needs.test-focused.result }}
      BROWSER_RESULT: ${{ needs.test-browser.result }}
      COMPILE_RESULT: ${{ needs.compile-tools.result }}
      PREPARED_RESULT: ${{ needs.test-prepared.result }}
      WEB_TARGETS_RESULT: ${{ needs.build-web-targets.result }}
      ANDROID_RESULT: ${{ needs.build-android.result }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      AIT_RESULT: ${{ needs.build-ait.result }}
      DEVVIT_RESULT: ${{ needs.build-devvit.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify expected CI coverage
        id: verify-coverage
        run: node tools/ci/verify-coverage.mjs
      - name: Attest the exact tested PR merge tree
        id: tested-merge
        if: ${{ !cancelled() && steps.verify-coverage.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/attest-pr-merge.mjs
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.tested-merge.outcome == 'success' && github.event_name == 'pull_request' }}
        with:
          name: ${{ steps.tested-merge.outputs.artifact_name }}
          path: ${{ runner.temp }}/ci-tested-merge.json
          retention-days: 7

  docs-deploy:
    # ci-required succeeds with intentionally skipped test jobs in its needs
    # chain. Override Actions' implicit success() so that skip does not
    # suppress the deployment after the required gate has passed.
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.docs_validation == 'true' && needs.docs-validation.result == 'success' && needs.ci-required.result == 'success' }}
    needs: [prepare, docs-validation, ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mpgd-kit-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip stale Pages artifacts
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${latest_main}" == "${GITHUB_SHA}" ]]; then
            echo 'deploy=true' >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipping Pages artifact from ${GITHUB_SHA}; main is ${latest_main}."
            echo 'deploy=false' >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/deploy-pages@v5
        id: deployment
        if: ${{ steps.current-main.outputs.deploy == 'true' }}
