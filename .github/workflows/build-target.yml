name: build-target

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options:
          - web-preview
          - microsoft-store
          - android
          - ios
          - ait
          - reddit
          - verse8
      profile:
        type: choice
        required: true
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'ios' && 'macos-26' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - if: inputs.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - if: inputs.target == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # Google removed the legacy `tools` package from the SDK repository;
        # the action's `tools platform-tools` default now fails. The explicit
        # sdkmanager steps install what each build needs.
        with:
          packages: ''

      - if: inputs.target == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:public
      - run: pnpm check
      - run: pnpm validate:catalog
      - run: pnpm validate:ads
      - run: pnpm validate:target-config
      - run: pnpm validate:effective-config
      - run: pnpm validate:targets
      - run: pnpm smoke:target-config
      - run: pnpm smoke:effective-config
      - run: pnpm smoke:adapter-effective-config
      - run: pnpm smoke:game-services
      - run: pnpm build:target "${TARGET}" "${PROFILE}"
        env:
          TARGET: ${{ inputs.target }}
          PROFILE: ${{ inputs.profile }}
      - run: pnpm smoke:target "${TARGET}"
        env:
          TARGET: ${{ inputs.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.target }}-${{ inputs.profile }}
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**
            apps/target-devvit/dist/**
