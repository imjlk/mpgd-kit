name: windows-lint-diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-lint-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: windows-lint-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/typescript-default-tooling'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [extends, direct]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: mise exec -- pnpm install --frozen-lockfile
      - name: Select config shape
        if: matrix.config == 'direct'
        shell: pwsh
        run: |
          $source = Get-Content lint.config.ts -Raw
          $source = $source.Replace("import { ignoredSourceFiles }", "import sourceConfig, { ignoredSourceFiles }")
          $source = [regex]::Replace($source, '(?s)export default \{.*?satisfies ITtscLintConfig<ITtscEvidenceRules>;', 'export default sourceConfig;')
          Set-Content lint.config.ts $source
      - name: Run isolated lint scope regression
        shell: pwsh
        run: |
          $env:TTSC_E2E_TRACE = Join-Path $env:RUNNER_TEMP 'lint-trace'
          New-Item -ItemType Directory -Force $env:TTSC_E2E_TRACE | Out-Null
          mise exec -- node --test --test-name-pattern='typed lint config scopes' tools/run-ttsx.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lint-trace-${{ matrix.config }}
          path: ${{ runner.temp }}/lint-trace
          retention-days: 1
