name: release-ios

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        default: production
        options:
          - staging
          - production
      mode:
        type: choice
        required: true
        default: signed-archive
        options:
          - sync
          - simulator
          - unsigned-archive
          - signed-archive
          - store-export

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:public
      - run: pnpm smoke:target-config
      - run: pnpm smoke:effective-config
      - run: pnpm smoke:adapter-effective-config
      - run: pnpm build:target ios "${PROFILE}"
        env:
          PROFILE: ${{ inputs.profile }}
          MPGD_NATIVE_BUILD_MODE: ${{ inputs.mode }}
          MPGD_IOS_TEAM_ID: ${{ secrets.MPGD_IOS_TEAM_ID }}
      - run: pnpm smoke:target ios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ inputs.profile }}
          path: |
            examples/phaser-starter/artifacts/**
            examples/phaser-starter/release-output/**
