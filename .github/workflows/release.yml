name: release

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

# Least privilege by default. Each job widens only what its own steps need, so
# dependency install scripts and the package build never see a write token.
permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `actions: read` only serves the manual-dispatch guard that inspects ci.yml
    # runs through `gh run list`.
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify CI for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --commit "${GITHUB_SHA}" \
            --limit 20 \
            --json status,conclusion,event,headSha)"
          conclusion="$(printf '%s' "${runs}" | jq -r --arg sha "${GITHUB_SHA}" '[.[] | select(.event == "push" and .headSha == $sha and .status == "completed")] | .[0].conclusion // empty')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Manual release requires a successful ci.yml push run for ${GITHUB_SHA}; got ${conclusion:-none}."
            exit 1
          fi
          echo "Manual release verified ci.yml success for ${GITHUB_SHA}."
      # Build package dist and smoke npm tarballs only. Target builds run in PR CI.
      - run: pnpm pack:packages

      # Every publishable package ships `files: ["dist"]` from the working tree
      # and dist/ is gitignored, so the publish job cannot rebuild it from the
      # checkout alone. A tar archive keeps the paths rooted at the workspace
      # and preserves file modes across the artifact round trip.
      - name: Archive built package dist directories
        run: |
          set -euo pipefail
          # Same roots as tools/package/workspace.ts; backend/ may not exist yet.
          roots=()
          for root in packages adapters native-plugins backend; do
            if [[ -d "${root}" ]]; then
              roots+=("${root}")
            fi
          done
          find "${roots[@]}" -mindepth 2 -maxdepth 2 -type d -name dist -print0 \
            | sort -z \
            | tar --null --files-from - -cf "${RUNNER_TEMP}/release-package-dist.tar"
          tar -tf "${RUNNER_TEMP}/release-package-dist.tar" | grep -q '/dist/index\.js$'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-package-dist
          path: ${{ runner.temp }}/release-package-dist.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Sampo pushes the release branch and tags, opens or updates the release
    # PR, publishes to npm through Trusted Publishing (OIDC), and the trailing
    # step dispatches ci.yml for the release PR.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A SHA checkout is detached; pnpm publish keeps its branch and clean-tree
      # checks enabled, so attach that exact CI-verified commit to local main.
      - name: Attach verified release commit to main
        run: git switch -C main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # Dependency lifecycle scripts already ran (and were exercised) in the
      # build job. Publishing needs only the package manager, the workspace
      # manifests, and the prebuilt dist directories restored below.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-package-dist
          path: ${{ runner.temp }}/release-package-dist

      - name: Restore built package dist directories
        run: tar -xf "${RUNNER_TEMP}/release-package-dist/release-package-dist.tar"

      # The tarball smoke already ran on these bytes in the build job. Guard
      # the restore itself so a missing dist fails here instead of publishing
      # an empty package (pnpm publish does not treat a missing `files` entry
      # as an error).
      - name: Verify restored package dist directories
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in packages/*/package.json adapters/*/package.json native-plugins/*/package.json backend/*/package.json; do
            if [[ "$(jq -r '.private // false' "${manifest}")" == "true" ]]; then
              continue
            fi
            package_dir="${manifest%/package.json}"
            for artifact in dist/index.js dist/index.d.ts; do
              if [[ ! -f "${package_dir}/${artifact}" ]]; then
                echo "::error::${package_dir} is missing ${artifact} after the artifact restore."
                exit 1
              fi
            done
            echo "Restored ${package_dir}/dist"
          done

      # Keep credentials out of checkout/install/restore. The helper reads the
      # step-scoped token when Sampo subsequently invokes git push.
      - name: Configure git authentication for Sampo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git --hostname github.com

      - name: Verify current main and track upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          # This preflight is a snapshot, not a lock on main. Keep pnpm's
          # branch/upstream checks enabled and never force a stale release.
          if [[ "${checked_out_sha}" != "${current_main_sha}" ]]; then
            echo "::error::Verified release commit ${checked_out_sha} is not current main ${current_main_sha}."
            exit 1
          fi
          git branch --set-upstream-to=origin/main main

      - name: Run Sampo release automation
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@f7241754458e1be4073902b2860596340c7d089c # sampo-v0.17.4
        with:
          command: auto
          create-github-release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue release PR validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_pr="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head release/main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "${release_pr}" ]; then
            gh workflow run ci.yml --ref release/main
          else
            echo "No open release/main PR found; skipping release PR validation dispatch."
          fi
