name: release

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A SHA checkout is detached; pnpm publish keeps its branch and clean-tree
      # checks enabled, so attach that exact CI-verified commit to local main.
      - name: Attach verified release commit to main
        run: git switch -C main

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify CI for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci.yml \
            --commit "${GITHUB_SHA}" \
            --limit 20 \
            --json status,conclusion,event,headSha)"
          conclusion="$(printf '%s' "${runs}" | jq -r --arg sha "${GITHUB_SHA}" '[.[] | select(.event == "push" and .headSha == $sha and .status == "completed")] | .[0].conclusion // empty')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Manual release requires a successful ci.yml push run for ${GITHUB_SHA}; got ${conclusion:-none}."
            exit 1
          fi
          echo "Manual release verified ci.yml success for ${GITHUB_SHA}."
      # Build package dist and smoke npm tarballs only. Target builds run in PR CI.
      - run: pnpm pack:packages

      # Keep credentials out of checkout/install/build. The helper reads the
      # step-scoped token when Sampo subsequently invokes git push.
      - name: Configure git authentication for Sampo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git --hostname github.com

      - name: Run Sampo release automation
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@sampo-v0.17.4
        with:
          command: auto
          create-github-release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Queue release PR validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_pr="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head release/main \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "${release_pr}" ]; then
            gh workflow run ci.yml --ref release/main
          else
            echo "No open release/main PR found; skipping release PR validation dispatch."
          fi
