# Run the generated POSIX target scripts consistently on Windows and Unix.
shellEmulator: true
packages:
  - '.'
  - 'apps/*'
__PNPM_WORKSPACE_KIT_PACKAGES__
allowBuilds:
  # Its postinstall only bakes in Firebase App Hosting config (FIREBASE_WEBAPP_CONFIG).
  '@firebase/util': false
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
overrides:
  '@xmldom/xmldom': '0.9.12'
